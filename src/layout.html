<!doctype html>
<html lang="ru" data-palette="aqua">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#F3ECE1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}assets/css/style.css">
<script>document.documentElement.classList.add('js');try{var p=localStorage.getItem('palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
</head>
<body class="{{bodyClass}}">
<a class="skip" href="#main">К содержанию</a>

<header class="header" id="header">
  <div class="header__in">
    <a class="logo" href="{{root}}index.html" aria-label="{{brand}} — на главную">{{brand}}</a>
    <nav class="nav" id="nav" aria-label="Основное меню">
      <a href="{{root}}portfolio.html"{{on_portfolio}}>Портфолио</a>
      <a href="{{root}}services.html"{{on_services}}>Услуги</a>
      <a href="{{root}}about.html"{{on_about}}>О дизайнере</a>
      <a href="{{root}}contacts.html"{{on_contacts}}>Контакты</a>
      <a class="btn btn--sm nav__cta" href="{{root}}contacts.html">Обсудить проект</a>
    </nav>
    <button class="burger" id="burger" aria-label="Меню" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <div class="footer__brand">
      <a class="logo" href="{{root}}index.html">{{brand}}</a>
      <p>{{tagline}}. С {{since}} года.</p>
      <p class="geo">{{geo}}</p>
    </div>
    <nav class="footer__nav" aria-label="Меню в подвале">
      <a href="{{root}}portfolio.html">Портфолио</a>
      <a href="{{root}}services.html">Услуги</a>
      <a href="{{root}}about.html">О дизайнере</a>
      <a href="{{root}}contacts.html">Контакты</a>
    </nav>
    <div class="footer__contacts">
      <a href="tel:{{phone_href}}">{{phone}}</a>
      <a href="mailto:{{email}}">{{email}}</a>
    </div>
  </div>
  <div class="wrap footer__bottom"><span>© {{brand}}, {{since}}–2026</span><span>Фотографии на сайте временные</span></div>
</footer>

<!-- Временный переключатель палитры: убрать после выбора цвета -->
<div class="palette" role="group" aria-label="Палитра (временно)">
  <span>Акцент</span>
  <button data-palette="aqua" title="Аквамарин"><i style="background:#24766F"></i>Аквамарин</button>
  <button data-palette="brass" title="Латунь"><i style="background:#8F6F3B"></i>Латунь</button>
</div>

<script src="{{root}}assets/js/main.js" defer></script>
</body>
</html>
