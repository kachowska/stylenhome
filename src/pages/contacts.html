<section class="pagehead wrap">
  <p class="eyebrow">Контакты</p>
  <h1>Обсудить проект</h1>
  <p class="lead">Оставьте заявку — ответим в течение дня. Встретимся лично в Минске или по видеосвязи из любой страны.</p>
</section>

<section class="wrap contact">
  <form class="form" id="lead-form" data-email="{{email}}" novalidate>
    <label>Имя<input name="name" autocomplete="name" required></label>
    <label>Телефон или мессенджер<input name="contact" autocomplete="tel" required placeholder="+375… / @telegram"></label>
    <div class="form__row">
      <label>Тип объекта
        <select name="type">
          <option>Квартира</option><option>Дом</option><option>Коммерческое помещение</option><option>Другое</option>
        </select>
      </label>
      <label>Площадь, м²<input name="area" inputmode="numeric"></label>
    </div>
    <label>Город и страна<input name="city" autocomplete="address-level2"></label>
    <label>Коротко о задаче<textarea name="message" rows="4"></textarea></label>
    <label class="check"><input type="checkbox" name="agree" required><span>Согласен(на) на обработку персональных данных</span></label>
    <button class="btn" type="submit">Отправить заявку</button>
    <p class="form__note" id="form-note" role="status"></p>
  </form>

  <aside class="contact__side">
    {{fan}}
    <dl>
      <div><dt>Телефон</dt><dd><a href="tel:{{phone_href}}">{{phone}}</a></dd></div>
      <div><dt>Почта</dt><dd><a href="mailto:{{email}}">{{email}}</a></dd></div>
      <div><dt>География</dt><dd>{{geo}}</dd></div>
      <div><dt>Время работы</dt><dd>Пн–Пт, 10:00–19:00 (Минск)</dd></div>
    </dl>
  </aside>
</section>
